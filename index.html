<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Suika Kawaii" />
    <title>Suika Kawaii - Frutas, Granja & Halloween</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="theme-fruits">
    <div id="game-container">
      <div id="ui-layer">
        <div class="score-container">
          <div style="font-size: 14px; opacity: 0.85; margin-bottom: 2px;">Puntaje:</div>
          <span id="score">0</span>
          
          <div id="opponent-score-container" class="hidden">
            <div style="font-size: 13px; opacity: 0.85; margin-top: 8px; color: #ff69b4;">Rival:</div>
            <span id="opponent-score" style="color: #ff69b4;">0</span>
          </div>
        </div>

        <!-- Theme Toggle Button at top center -->
        <div class="theme-switch-container">
          <button id="theme-toggle-btn" class="theme-switch-btn" title="Cambiar Tema">
            <span id="theme-toggle-icon">🐮</span>
            <span id="theme-toggle-label">Granja</span>
          </button>
        </div>

        <div class="next-fruit-container">
          <div id="next-fruit-preview"></div>
        </div>

        <!-- Floating PWA Install button for quick 1-tap install on phone -->
        <button id="pwa-install-top-btn" class="pwa-install-btn hidden" title="Instalar en el celular">
          📲 Instalar
        </button>
      </div>
    </div>
    
    <div id="game-over-screen" class="hidden">
      <div class="game-over-modal">
        <h1 id="game-over-title">¡Juego Terminado!</h1>
        <p>Puntaje: <span id="final-score">0</span></p>
        
        <div id="submit-score-section">
          <input type="text" id="player-name" placeholder="Tu Nombre" maxlength="15" />
          <button id="submit-score-btn">Guardar Puntaje</button>
        </div>

        <div id="leaderboard-section">
          <h2>Top 5 Global</h2>
          <ul id="leaderboard-list">
            <li>Cargando...</li>
          </ul>
        </div>

        <button id="restart-button">Volver al Menú</button>
      </div>
    </div>

    <!-- Start Overlay for Audio Policy, Mode, Theme & PWA Install -->
    <div id="start-screen">
      <div class="start-modal">
        <h1 id="start-modal-title">🍉 Suika Kawaii</h1>
        <p id="start-modal-subtitle" style="font-size: 14px; margin-bottom: 12px;">¡Elige tu tema y fusiona!</p>
        
        <!-- 3 Theme Selector Cards -->
        <div class="theme-cards-container">
          <button class="theme-card active" data-theme="fruits" id="select-theme-fruits">
            <div class="theme-card-icon">🍉</div>
            <div class="theme-card-title">Frutas</div>
            <div class="theme-card-desc">Playa & Cristal</div>
          </button>
          
          <button class="theme-card" data-theme="animals" id="select-theme-animals">
            <div class="theme-card-icon">🐮</div>
            <div class="theme-card-title">Granja</div>
            <div class="theme-card-desc">Animalitos</div>
          </button>

          <button class="theme-card" data-theme="halloween" id="select-theme-halloween">
            <div class="theme-card-icon">🎃</div>
            <div class="theme-card-title">Halloween</div>
            <div class="theme-card-desc">Fantasmas</div>
          </button>
        </div>

        <!-- PWA Install button inside modal -->
        <button id="pwa-install-modal-btn" class="pwa-install-banner-btn hidden">
          <span>📲 Instalar App en el Celular</span>
          <span style="font-size: 11px; opacity: 0.85;">Juega sin navegador y a pantalla completa</span>
        </button>

        <div id="mode-selection" style="width: 100%; margin-top: 6px;">
          <button id="play-solo-btn" class="menu-btn">Jugar Ahora</button>
          <button id="play-multi-btn" class="menu-btn secondary-btn">Modo Multijugador</button>
        </div>

        <div id="multiplayer-lobby" class="hidden" style="width: 100%;">
          <h3>Salas Multijugador</h3>
          <button id="create-room-btn" class="menu-btn">Crear Sala</button>
          
          <div style="margin: 10px 0; font-weight: bold; color: #64748b;">O</div>
          
          <input type="text" id="room-code-input" placeholder="Ej. A4X9" maxlength="4" style="text-transform: uppercase;"/>
          <button id="join-room-btn" class="menu-btn secondary-btn">Unirse a Sala</button>
          <button id="back-to-menu-btn" style="margin-top: 10px; font-size: 14px; padding: 5px 10px; background: none; border: none; text-decoration: underline; color: #64748b; cursor: pointer;">Volver</button>
        </div>

        <div id="waiting-room" class="hidden">
          <h3>Esperando rival...</h3>
          <p>Tu código de sala es:</p>
          <h2 id="room-code-display" style="letter-spacing: 5px; font-size: 38px; color: #ea580c; margin: 10px 0;">----</h2>
          <p style="font-size: 13px;">Dile a la otra persona que use este código en "Unirse a Sala".</p>
        </div>

      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
